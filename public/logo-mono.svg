  />

  <!-- Diagonal crack: line in #EDEDF0 monochrome -->
  <path
    d="M 172 110 L 228 206 L 218 246 L 294 306 L 284 346 L 340 402"
    stroke="#EDEDF0"
    stroke-width="3"
    stroke-linecap="round"
